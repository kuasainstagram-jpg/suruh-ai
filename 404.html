<script>
// domain.com/CODE  ->  domain.com/?ref=CODE   (also works under a sub-path such as user.github.io/repo/CODE)
(function () {
  var parts = location.pathname.replace(/\/+$/, "").split("/");
  var last = parts.pop() || "";
  var base = parts.join("/") + "/";
  if (/^[A-Za-z0-9]{6}$/.test(last)) location.replace(base + "?ref=" + last.toUpperCase());
  else location.replace(base);
})();
</script>
